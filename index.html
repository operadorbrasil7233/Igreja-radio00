<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assembleia de Deus Torre Forte</title>


<link rel="stylesheet"
href="https://cdn.positus.global/production/resources/robbu/whatsapp-button/whatsapp-button.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:Arial,sans-serif;

background:#f2f2f2;

color:#222;

}



header{

text-align:center;

padding:25px 15px;

}


.logo{

width:160px;

max-width:80%;

}


h1{

color:#1e3a8a;

font-size:2rem;

margin-top:10px;

}


.subtitulo{

color:#555;

font-size:16px;

}




.conteudo{

width:100%;

max-width:900px;

margin:auto;

padding:15px;

}




.player-card,
.chat-box,
.contador{


background:white;

padding:20px;

border-radius:20px;

box-shadow:0 4px 15px rgba(0,0,0,.12);

margin-bottom:20px;


}



.player-card{

text-align:center;

}



h2,h3{

color:#1e3a8a;

margin-bottom:20px;

}





/* VIDEO */


.video-container{

position:relative;

width:100%;

aspect-ratio:16/9;

overflow:hidden;

border-radius:15px;

}



.video-container iframe{


position:absolute;

width:100%;

height:100%;

border:0;

}





/* INDICADOR AO VIVO */


.ao-vivo{


position:absolute;

top:15px;

left:15px;


background:#d00000;


color:white;


padding:8px 15px;


border-radius:20px;


font-size:14px;


font-weight:bold;


z-index:5;


display:flex;


align-items:center;


gap:8px;


}



.bolinha{


width:12px;

height:12px;


background:white;


border-radius:50%;


animation:pulsar 1s infinite;


}



@keyframes pulsar{


50%{

opacity:.3;

transform:scale(1.5);

}


}






/* BANNER */


.banner{


width:100%;


max-width:850px;


height:auto;


display:block;


margin:25px auto 0;


border-radius:15px;


}







/* RESPONSIVO */


@media(max-width:768px){


h1{

font-size:1.5rem;

}



.conteudo{

padding:10px;

}



.player-card,
.chat-box{

border-radius:15px;

}



}


</style>


</head>



<body>



<header>


<img class="logo"

src="./img/1000448259-removebg-preview (2).png">


<h1>

Assembleia de Deus Torre Forte

</h1>


<p class="subtitulo">

Web Rádio • Louvores • Palavra • Oração

</p>



</header>





<main class="conteudo">





<div class="player-card">



<h2>

🎵 Ao Vivo Agora

</h2>




<div class="video-container">



<iframe

src="https://www.youtube.com/embed/qxzQR5uwWsk"

allowfullscreen>

</iframe>





<div class="ao-vivo">


<span class="bolinha"></span>


AO VIVO


<span>

👥 <span id="ouvintes-online">0</span>

</span>


</div>



</div>





<img class="banner"

src="./IMG_20260805_160412.jpg"

alt="Banner Torre Forte">





</div>

<!-- CHAT AO VIVO -->


<div class="chat-box">


<h3>

💬 Chat Ao Vivo

<div id="mensagens"></div>



<div class="chat-input">

id="nome"

<textarea

id="mensagem"

</textarea>




<button onclick="enviarMensagem()">

Enviar mensagem

</div>



</div>





<!-- PEDIDOS DE ORAÇÃO -->


<div class="chat-box">


<h3>

🙏 Pedidos de Oração e Louvores

</h3>



<div id="pedidos"></div>




<div class="chat-input">


<input

id="nomePedido"

placeholder="Seu nome">





<textarea

id="pedido"

placeholder="Digite seu pedido de oração ou louvor">

</textarea>




<button onclick="enviarPedido()">

Enviar pedido

</button>



</div>



</div>







<!-- CONTADOR -->


<div class="contador">


👥 Visitas ao site:

<span id="contador-visitas">

0

</span>



</div>







<!-- WHATSAPP -->


<a id="robbu-whatsapp-button"

target="_blank"

href="https://api.whatsapp.com/send?phone=5585988099844&text=Ol%C3%A1%20vim%20atrav%C3%A9s%20da%20webr%C3%A1dio%20quero%20pedir%20um%20louvor%20ou%20ora%C3%A7%C3%A3o">


<div class="rwb-tooltip">

<footer>

</footer>
<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,

ref,

push,

onChildAdded,

get,

set,

onValue,

remove

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {


apiKey: "AIzaSyDPEFjQ2kwWPqSDxrUHlnIya6P0CJtMm8g",

authDomain: "radiotorreforte-dcc9c.firebaseapp.com",

databaseURL: "https://radiotorreforte-dcc9c-default-rtdb.firebaseio.com",

projectId: "radiotorreforte-dcc9c",

storageBucket: "radiotorreforte-dcc9c.firebasestorage.app",

messagingSenderId: "1056332477774",

appId: "1:1056332477774:web:4e4eff0568d16072e39a1f",

measurementId: "G-TQZ3787R0P"

};





const app = initializeApp(firebaseConfig);


const db = getDatabase(app);





/* =====================
CHAT AO VIVO
===================== */


const chatRef = ref(db,"mensagens");



window.enviarMensagem = function(){


const nome = document.getElementById("nome").value.trim();


const mensagem = document.getElementById("mensagem").value.trim();




if(nome==="" || mensagem===""){


alert("Digite seu nome e sua mensagem");


return;


}



push(chatRef,{


nome:nome,

mensagem:mensagem,

data:new Date().toLocaleString("pt-BR")


});



document.getElementById("mensagem").value="";


}




onChildAdded(chatRef,(dados)=>{


const m=dados.val();



document.getElementById("mensagens").innerHTML += `


<div class="msg">


<strong>${m.nome}</strong>


<br>


${m.mensagem}


<small>${m.data}</small>


</div>


`;



});







/* =====================
PEDIDOS DE ORAÇÃO
===================== */


const pedidosRef = ref(db,"pedidos");




window.enviarPedido=function(){


const nome=document.getElementById("nomePedido").value.trim();


const pedido=document.getElementById("pedido").value.trim();




if(nome==="" || pedido===""){


alert("Digite seu nome e seu pedido");


return;


}





push(pedidosRef,{


nome:nome,

pedido:pedido,

data:new Date().toLocaleString("pt-BR")


});



document.getElementById("pedido").value="";


}







onChildAdded(pedidosRef,(dados)=>{


const p=dados.val();



document.getElementById("pedidos").innerHTML += `


<div class="pedido">


<strong>${p.nome}</strong>


<br>


${p.pedido}


<small>${p.data}</small>


</div>


`;



});









/* =====================
CONTADOR DE VISITAS
===================== */


const contadorRef=ref(db,"contador/visitas");



get(contadorRef).then((snap)=>{


let total=0;



if(snap.exists()){


total=snap.val();


}



set(contadorRef,total+1);



});





onValue(contadorRef,(snap)=>{


document.getElementById("contador-visitas").innerText =

snap.val() || 0;



});









/* =====================
OUVINTES ONLINE
===================== */


const id=Math.random().toString(36).substring(2);



const onlineRef=ref(db,"ouvintes/"+id);



set(onlineRef,true);



window.addEventListener("beforeunload",()=>{


remove(onlineRef);


});





onValue(ref(db,"ouvintes"),(snap)=>{


let total=0;



if(snap.exists()){


total=Object.keys(snap.val()).length;


}




document.getElementById("ouvintes-online").innerText=total;



});




</script>



</body>
