<!DOCTYPE html>
<html lang="pt-br">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembleia de Deus Torre Forte</title>

    <link rel="stylesheet"
        href="https://cdn.positus.global/production/resources/robbu/whatsapp-button/whatsapp-button.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            line-height: 1.5;
        }

        header {
            text-align: center;
            padding: 25px 15px 10px;
        }

        .logo {
            width: 160px;
            max-width: 80%;
            margin-bottom: 15px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #555;
            font-size: 1rem;
        }

        .conteudo {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
        }

        /* Card principal */
        .player-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .player-card h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        /* Vídeo responsivo */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .imgT {
            width: 180px;
            max-width: 80%;
            height: auto;
            display: block;
            margin: 25px auto 15px;
        }

        /* Chat */
        .chat-box {
            margin-top: 30px;
            background: #fff;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .chat-box h3 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 0.9rem;
        }
        .contador {
    margin-top: 20px;
    background: #ffffff;
    padding: 12px 18px;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #1e3a8a;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6rem;
            }

            .player-card,
            .chat-box {
                padding: 15px;
                border-radius: 16px;
            }

            .conteudo {
                padding: 10px;
            }
        }
    </style>
</head>

    let visitas = localStorage.getItem("visitasSite");
