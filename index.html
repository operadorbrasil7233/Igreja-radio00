<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Assembleia de Deus Torre Forte</title>

    <link rel="stylesheet"
        href="https://cdn.positus.global/production/resources/robbu/whatsapp-button/whatsapp-button.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000, #111827, #1e293b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 30px 15px 10px;
        }

        .logo {
            width: 160px;
            max-width: 80%;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
        }

        h1 {
            font-size: 2rem;
            color: #facc15;
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #cbd5e1;
            font-size: 1rem;
        }

        .conteudo {
            width: 100%;
            max-width: 850px;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .player-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .player-card h2 {
            color: #facc15;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .imgT {
            width: 220px;
            max-width: 70%;
            margin: 25px auto 10px;
            display: block;
        }

        #mostra {
            margin-top: 15px;
            color: #e2e8f0;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.6rem;
            }

            .player-card {
                padding: 18px;
                border-radius: 18px;
            }

            .player-card h2 {
                font-size: 1.2rem;
            }

            .conteudo {
                padding: 12px;
            }
        }
    </style>
</head>

<body onload="moura()">

    <header>
        <img class="logo"
            src="./img/1000448259-removebg-preview (2).png"
            alt="Logo Torre Forte">

        <h1>Assembleia de Deus Torre Forte</h1>
        <p class="subtitulo">Web Rádio • Louvores • Palavra • Oração</p>
    </header>

    <main class="conteudo">
        <div class="player-card">

            <h2>▶ Ao Vivo Agora</h2>

            <div class="video-container">
                <iframe
                    src="https://www.youtube.com/embed/qxzQR5uwWsk?si=utQRBDOmMWAuEXXI"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <div id="mostra"></div>

            <img id="foto" class="imgT"
                src="./img/1000448259-removebg-preview (2).png"
                alt="Torre Forte">

        </div>
    </main>

    <footer id="footer">
        <p>© 2026 Assembleia de Deus Torre Forte — Todos os direitos reservados.</p>
    </footer>

    <script src="js/radio.js"></script>

    <a id="robbu-whatsapp-button"
        target="_blank"
        href="https://api.whatsapp.com/send?phone=5585988099844&text=Ol%C3%A1%20vim%20atrav%C3%A9s%20da%20webr%C3%A1dio%20quero%20pedir%20um%20louvor%20ou%20ora%C3%A7%C3%A3o">

        <div class="rwb-tooltip">Peça seu louvor ou oração</div>

        <img src="https://cdn.positus.global/production/resources/robbu/whatsapp-button/whatsapp-icon.svg">
    </a>

</body>

</html>
