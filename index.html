<!-- FIREBASE CHAT -->

<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,

ref,

push,

onChildAdded

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {


apiKey: "AIzaSyDPEFjQ2kwWPqSDxrUHlnIya6P0CJtMm8g",


authDomain: "radiotorreforte-dcc9c.firebaseapp.com",


databaseURL: "https://radiotorreforte-dcc9c-default-rtdb.firebaseio.com",


projectId: "radiotorreforte-dcc9c",


storageBucket: "radiotorreforte-dcc9c.firebasestorage.app",


messagingSenderId: "1056332477774",


appId: "1:1056332477774:web:4e4eff0568d16072e39a1f",


measurementId: "G-TQZ3787R0P"


};





const app = initializeApp(firebaseConfig);


const db = getDatabase(app);


const chat = ref(db,"mensagens");






window.enviarMensagem = function(){


let nome = document
.getElementById("nome")
.value;


let mensagem = document
.getElementById("mensagem")
.value;



if(nome.trim()=="" || mensagem.trim()==""){


alert("Digite seu nome e sua mensagem");


return;


}




push(chat,{


nome:nome,


mensagem:mensagem,


data:new Date()
.toLocaleString("pt-BR")


});



document
.getElementById("mensagem")
.value="";


}





onChildAdded(chat,(dados)=>{


let msg=dados.val();


let area=document
.getElementById("mensagens");



area.innerHTML += `


<div class="msg">


<strong>${msg.nome}</strong>


<br>


${msg.mensagem}


<small>${msg.data}</small>


</div>


`;



area.scrollTop=area.scrollHeight;



});



</script>





<!-- CONTADOR LOCAL -->


<script>


let visitas = localStorage.getItem("visitasTorreForte");


if(!visitas){

visitas=1;

}else{

visitas=parseInt(visitas)+1;

}


localStorage.setItem(
"visitasTorreForte",
visitas
);



document.getElementById(
"contador-visitas"
).innerText=visitas;



</script>
