<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;
background:#f2f2f2;
color:#222;

}


header{

text-align:center;
padding:25px 15px;

}


.logo{

width:160px;
max-width:80%;

}


h1{

color:#1e3a8a;
font-size:2rem;

}


.subtitulo{

color:#555;

}


/* AO VIVO */

.video-container{

position:relative;
width:100%;
padding-bottom:56.25%;
height:0;
overflow:hidden;
border-radius:15px;

}


.ao-vivo{

position:absolute;

top:15px;
left:15px;

background:#d00000;

color:white;

padding:8px 15px;

border-radius:20px;

font-weight:bold;

z-index:10;

display:flex;

align-items:center;

gap:8px;

}


.bolinha{

width:12px;
height:12px;

background:white;

border-radius:50%;

animation:pulsar 1s infinite;

}


@keyframes pulsar{

50%{

opacity:.3;

transform:scale(1.5);

}

}



/* LAYOUT */

.conteudo{

max-width:900px;

width:100%;

margin:auto;

padding:15px;

}



.player-card,
.chat-box,
.contador{

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 4px 15px rgba(0,0,0,.12);

margin-bottom:20px;

}



.player-card{

text-align:center;

}



h2,h3{

color:#1e3a8a;

margin-bottom:20px;

}



.video-container iframe{

position:absolute;

width:100%;

height:100%;

border:0;

}



.banner{

width:100%;

max-width:850px;

height:auto;

margin:25px auto;

display:block;

border-radius:15px;

}




/* CHAT */


#mensagens,
#pedidos{

height:300px;

overflow-y:auto;

background:#f5f5f5;

padding:10px;

border-radius:15px;

}



.msg{

background:#1e3a8a;

color:white;

padding:12px;

border-radius:12px;

margin-bottom:10px;

}



.msg small,
.pedido small{

display:block;

font-size:11px;

margin-top:5px;

}



.pedido{

background:white;

padding:12px;

border-left:5px solid #1e3a8a;

border-radius:10px;

margin-bottom:10px;

}



.chat-input{

margin-top:15px;

}



.chat-input input,
.chat-input textarea{


width:100%;

padding:12px;

border-radius:10px;

border:1px solid #ccc;

margin-bottom:10px;

font-size:16px;

}



.chat-input textarea{

height:80px;

resize:none;

}



.chat-input button{

width:100%;

background:#1e3a8a;

color:white;

border:0;

padding:12px;

border-radius:10px;

font-size:16px;

}



/* CONTADOR */

.contador{

text-align:center;

font-size:18px;

font-weight:bold;

color:#1e3a8a;

}



footer{

text-align:center;

padding:20px;

color:#555;

}



@media(max-width:768px){

h1{

font-size:1.5rem;

}

}

</style>

</head>


<body>

<!-- FIREBASE -->

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

push,

onChildAdded,

get,

set,

onValue,

remove

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {


apiKey: "AIzaSyDPEFjQ2kwWPqSDxrUHlnIya6P0CJtMm8g",

authDomain: "radiotorreforte-dcc9c.firebaseapp.com",

databaseURL: "https://radiotorreforte-dcc9c-default-rtdb.firebaseio.com",

projectId: "radiotorreforte-dcc9c",

storageBucket: "radiotorreforte-dcc9c.firebasestorage.app",

messagingSenderId: "1056332477774",

appId: "1:1056332477774:web:4e4eff0568d16072e39a1f",

measurementId: "G-TQZ3787R0P"

};




const app = initializeApp(firebaseConfig);


const db = getDatabase(app);





/* CHAT */


const chatRef = ref(db,"mensagens");



window.enviarMensagem=function(){


let nome=document.getElementById("nome").value;

let mensagem=document.getElementById("mensagem").value;



if(nome.trim()=="" || mensagem.trim()==""){

alert("Digite seu nome e sua mensagem");

return;

}



push(chatRef,{

nome:nome,

mensagem:mensagem,

data:new Date().toLocaleString("pt-BR")

});



document.getElementById("mensagem").value="";


}



onChildAdded(chatRef,(dados)=>{


let m=dados.val();


document.getElementById("mensagens").innerHTML += `


<div class="msg">


<strong>${m.nome}</strong>

<br>

${m.mensagem}


<small>${m.data}</small>


</div>


`;



});







/* PEDIDOS DE ORAÇÃO */


const pedidosRef = ref(db,"pedidos");



window.enviarPedido=function(){


let nome=document.getElementById("nomePedido").value;

let pedido=document.getElementById("pedido").value;



if(nome.trim()=="" || pedido.trim()==""){

alert("Digite seu nome e seu pedido");

return;

}



push(pedidosRef,{

nome:nome,

pedido:pedido,

data:new Date().toLocaleString("pt-BR")

});



document.getElementById("pedido").value="";


}



onChildAdded(pedidosRef,(dados)=>{


let p=dados.val();



document.getElementById("pedidos").innerHTML += `


<div class="pedido">


<strong>${p.nome}</strong>

<br>

${p.pedido}


<small>${p.data}</small>


</div>


`;



});







/* CONTADOR REAL DE VISITAS */


const contadorRef = ref(db,"contador/visitas");



get(contadorRef).then((snap)=>{


let total = 0;


if(snap.exists()){

total=snap.val();

}


set(contadorRef,total+1);


});



onValue(contadorRef,(snap)=>{


document.getElementById("contador-visitas").innerText =

snap.val() || 0;


});








/* OUVINTES ONLINE */


const idUsuario = Date.now();


const onlineRef = ref(db,"ouvintes/"+idUsuario);



set(onlineRef,true);



window.addEventListener("beforeunload",()=>{


remove(onlineRef);


});



onValue(ref(db,"ouvintes"),(snap)=>{


let total=0;



if(snap.exists()){


total=Object.keys(snap.val()).length;


}



document.getElementById("ouvintes-online").innerText=total;



});



</script>
